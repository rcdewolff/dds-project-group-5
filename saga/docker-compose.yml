services:
  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - order-checkout-worker
      - order-service
      - stock-service
      - payment-service

  # ---------------------------------------------------------------------------
  # Order Service
  # ---------------------------------------------------------------------------
  order-service:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/routes', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - GATEWAY_URL=http://gateway:80
      - PYTHONUNBUFFERED=1
    command: gunicorn -b 0.0.0.0:5000 -w 10 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-checkout-worker:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    command: uvicorn checkout_worker:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      - CHECKOUT_MAX_INFLIGHT=600
      - CHECKOUT_COMMANDS_TOPIC=checkout-commands
      - CHECKOUT_RESULTS_TOPIC=checkout-results
      - CHECKOUT_WORKER_GROUP_ID=checkout-worker
      - PYTHONUNBUFFERED=1
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-consumer:
    build: ./order
    deploy:
      replicas: 6
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    environment:
      - PYTHONUNBUFFERED=1
      - INIT_DB=false
    command: python consumer.py
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      order-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-producer:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./services:/home/flask-app/services
    image: order:latest
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.05
    command: python producer.py
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-citus-db:
    image: citusdata/citus:13.0
    command: postgres -c ssl=off
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=orders
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Stock Service
  # ---------------------------------------------------------------------------
  stock-service:
    build: ./stock
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/items', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stock-consumer:
    build: ./stock
    deploy:
      replicas: 6
    environment:
      - PYTHONUNBUFFERED=1
      - INIT_DB=false
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    command: python consumer.py
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stock-producer:
    build: ./stock
    volumes:
      - ./stock:/home/flask-app/
      - ./services:/home/flask-app/services
    image: stock:latest
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.05
    command: python producer.py
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      stock-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stock-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=stocks
    command: postgres -c ssl=off
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Payment Service
  # ---------------------------------------------------------------------------
  payment-service:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/users', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  payment-consumer:
    build: ./payment
    deploy:
      replicas: 6
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    command: python consumer.py
    environment:
      - PYTHONUNBUFFERED=1
      - INIT_DB=false
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy

  payment-producer:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./services:/home/flask-app/services
    image: payment:latest
    command: python producer.py
    environment:
      - PYTHONUNBUFFERED=1
      - OUTBOX_POLL_INTERVAL=0.05
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  payment-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=payments
    command: postgres -c ssl=off
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:latest
    command: ["/bin/sh", "/scripts/create-kafka-topics.sh"]
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_APP_TOPIC_PARTITIONS=6
      - KAFKA_APP_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka_data:
