name: checkout-2pc-90cpu

services:
  gateway:
    image: nginx:1.25-bookworm
    cpus: "4.0"
    deploy:
      replicas: 1
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./coordinator:/home/flask-app/coordinator
      - ./kafka_service:/home/flask-app/kafka_service
    image: order:latest
    cpus: "2.0"
    deploy:
      replicas: 15
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/routes', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - GATEWAY_URL=http://gateway:80
      - PYTHONUNBUFFERED=1
    command: gunicorn -b 0.0.0.0:5000 -w 4 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      order-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-citus-db:
    image: citusdata/citus:13.0
    command: >
      postgres
      -c ssl=off
      -c max_connections=400
      -c shared_buffers=512MB
      -c work_mem=4MB
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=orders
    ports:
      - "5432:5432"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  stock-service:
    build: ./stock
    volumes:
      - ./stock:/home/flask-app/
      - ./kafka_service:/home/flask-app/kafka_service
    image: stock:latest
    cpus: "2.0"
    deploy:
      replicas: 10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/items', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - PYTHONUNBUFFERED=1
    command: gunicorn -b 0.0.0.0:5000 -w 4 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      stock-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  stock-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=stocks
    command: >
      postgres
      -c ssl=off
      -c max_connections=200
      -c shared_buffers=128MB
      -c work_mem=2MB
    ports:
      - "5433:5432"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "3.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./kafka_service:/home/flask-app/kafka_service
    image: payment:latest
    cpus: "2.0"
    deploy:
      replicas: 10
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/users', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - PYTHONUNBUFFERED=1
    command: gunicorn -b 0.0.0.0:5000 -w 4 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      payment-citus-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-citus-db:
    image: citusdata/citus:13.0
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=payments
    command: >
      postgres
      -c ssl=off
      -c max_connections=200
      -c shared_buffers=128MB
      -c work_mem=2MB
    ports:
      - "5434:5432"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "3.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    cpus: "3.0"
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  kafka_data:
