global
    log stdout format raw local0
    maxconn 200

defaults
    log     global
    mode    tcp
    retries 2
    timeout connect  3s
    timeout client  30s
    timeout server  30s
    timeout check    2s

# ── Stats page ────────────────────────────────────────────────────────────────
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends

# ── Orders DB cluster (port 5432) ─────────────────────────────────────────────
# HAProxy checks Patroni's REST API (/primary returns 200 only on the leader).
# All writes and reads go to the current primary; the replica is on standby.
frontend orders_frontend
    bind *:5432
    default_backend orders_backend

backend orders_backend
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server order-db-1 order-db-1:5432 check port 8008
    server order-db-2 order-db-2:5432 check port 8008

# ── Stock DB cluster (port 5433) ──────────────────────────────────────────────
frontend stock_frontend
