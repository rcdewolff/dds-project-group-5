services:

  # ── Gateway ────────────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  # ── Application services ───────────────────────────────────────────────────
  order-service:
    build: ./order
    volumes:
      - ./order:/home/flask-app/
      - ./coordinator:/home/flask-app/coordinator
      - ./kafka_service:/home/flask-app/kafka_service
    image: order:latest
    environment:
      - GATEWAY_URL=http://gateway:80
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/order_citus.env
      - env/kafka_settings.env
    depends_on:
      db-haproxy:
        condition: service_healthy

  stock-service:
    build: ./stock
    volumes:
      - ./stock:/home/flask-app/
      - ./kafka_service:/home/flask-app/kafka_service
    image: stock:latest
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/stock_citus.env
      - env/kafka_settings.env
    depends_on:
      db-haproxy:
        condition: service_healthy

  payment-service:
    build: ./payment
    volumes:
      - ./payment:/home/flask-app/
      - ./kafka_service:/home/flask-app/kafka_service
    image: payment:latest
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --config gunicorn.conf.py --log-level=info app:app
    env_file:
      - env/payment_citus.env
      - env/kafka_settings.env
    depends_on:
      db-haproxy:
        condition: service_healthy

  # ── Distributed consensus (required by Patroni for leader election) ────────
  etcd:
    image: bitnami/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2379/health | grep -q '\"health\":\"true\"'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Orders DB cluster ──────────────────────────────────────────────────────
  # Two Patroni-managed PostgreSQL nodes; etcd elects one as primary.
  # Node naming is neutral (db-1 / db-2); either can hold the primary role.
  order-db-1:
    build: ./patroni
    environment:
      PATRONI_NAME: order-db-1
      PATRONI_SCOPE: order-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
      REPLICATION_PASSWORD: replicator
    volumes:
      - order_db_1_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  order-db-2:
    build: ./patroni
    environment:
      PATRONI_NAME: order-db-2
      PATRONI_SCOPE: order-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders
      REPLICATION_PASSWORD: replicator
    volumes:
      - order_db_2_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
      order-db-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── Stock DB cluster ───────────────────────────────────────────────────────
  stock-db-1:
    build: ./patroni
    environment:
      PATRONI_NAME: stock-db-1
      PATRONI_SCOPE: stock-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocks
      REPLICATION_PASSWORD: replicator
    volumes:
      - stock_db_1_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  stock-db-2:
    build: ./patroni
    environment:
      PATRONI_NAME: stock-db-2
      PATRONI_SCOPE: stock-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stocks
      REPLICATION_PASSWORD: replicator
    volumes:
      - stock_db_2_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
      stock-db-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── Payment DB cluster ─────────────────────────────────────────────────────
  payment-db-1:
    build: ./patroni
    environment:
      PATRONI_NAME: payment-db-1
      PATRONI_SCOPE: payment-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
      REPLICATION_PASSWORD: replicator
    volumes:
      - payment_db_1_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  payment-db-2:
    build: ./patroni
    environment:
      PATRONI_NAME: payment-db-2
      PATRONI_SCOPE: payment-cluster
      PATRONI_ETCD_HOST: etcd
      PATRONI_ETCD_PORT: 2379
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
      REPLICATION_PASSWORD: replicator
    volumes:
      - payment_db_2_data:/data/patroni
    depends_on:
      etcd:
        condition: service_healthy
      payment-db-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── HAProxy – transparent primary routing ─────────────────────────────────
  # A single HAProxy instance exposes one port per cluster. It polls Patroni's
  # /primary REST endpoint (HTTP 200 = leader, 503 = replica) and only routes
  # traffic to the current primary, making failover transparent to all services.
  db-haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"   # orders primary
      - "5433:5433"   # stock  primary
      - "5434:5434"   # payment primary
      - "8404:8404"   # HAProxy stats page
    depends_on:
      order-db-1:
        condition: service_healthy
      stock-db-1:
        condition: service_healthy
      payment-db-1:
        condition: service_healthy
    # Healthy once every cluster has at least one node answering /primary.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          (curl -sf http://order-db-1:8008/primary || curl -sf http://order-db-2:8008/primary) &&
          (curl -sf http://stock-db-1:8008/primary || curl -sf http://stock-db-2:8008/primary) &&
          (curl -sf http://payment-db-1:8008/primary || curl -sf http://payment-db-2:8008/primary)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  etcd_data:
  order_db_1_data:
  order_db_2_data:
  stock_db_1_data:
  stock_db_2_data:
  payment_db_1_data:
  payment_db_2_data:
  kafka_data:
